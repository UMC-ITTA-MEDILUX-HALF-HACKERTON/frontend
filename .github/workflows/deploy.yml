# Vercel 자동 배포. main 에 push 하면 프로덕션, PR 은 프리뷰로 배포한다.
# Vercel 의 Git 연동(vercel git connect)은 조직의 비공개 저장소를 Hobby 플랜에서 연결하지 못해
# GitHub Actions 에서 Vercel CLI 로 배포한다.
#
# 저장소 시크릿 (Settings > Secrets and variables > Actions)
#   VERCEL_TOKEN       https://vercel.com/account/tokens 에서 만든 토큰
#   VERCEL_ORG_ID      .vercel/project.json 의 orgId
#   VERCEL_PROJECT_ID  .vercel/project.json 의 projectId
# 시크릿이 없으면 검사만 하고 배포 단계는 건너뛴다.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI: vercel@64.2.0
  # main 에 push 한 경우만 프로덕션이다.
  IS_PROD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 검사 (린트, 포맷, 타입, 테스트)
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck
          pnpm test

      - name: 배포 건너뜀 (Vercel 시크릿 없음)
        if: ${{ env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == '' }}
        run: echo "::notice::VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID 시크릿이 없어 배포를 건너뜁니다."

      - name: Vercel 환경 불러오기
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: pnpm dlx $VERCEL_CLI pull --yes --environment=${{ env.IS_PROD == 'true' && 'production' || 'preview' }} --token="$VERCEL_TOKEN"

      - name: 빌드
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: pnpm dlx $VERCEL_CLI build ${{ env.IS_PROD == 'true' && '--prod' || '' }} --token="$VERCEL_TOKEN"

      - name: 배포
        id: deploy
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: |
          url=$(pnpm dlx $VERCEL_CLI deploy --prebuilt ${{ env.IS_PROD == 'true' && '--prod' || '' }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "배포 주소: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: PR 에 프리뷰 주소 남기기
        if: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "프리뷰 배포: ${{ steps.deploy.outputs.url }}"
